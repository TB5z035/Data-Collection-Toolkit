name: Release

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m pip install -e .[test]

      - name: Validate release tag
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          if not re.fullmatch(r"\d+\.\d+\.\d+", tag):
            raise SystemExit(
                f"Release tag '{tag}' must match the format <major>.<minor>.<patch>."
            )

          data = tomllib.loads(Path("pyproject.toml").read_text())
          version = data["project"]["version"]
          if tag != version:
            raise SystemExit(
                f"Release tag '{tag}' does not match project version '{version}'."
            )
          PY

      - name: Run non-hardware tests
        run: python -m pytest -m "not hardware"

      - name: Build package artifacts
        run: python -m build

      - name: Compute release metadata
        id: release_meta
        run: |
          tag="${GITHUB_REF_NAME}"
          previous_tag="$(git tag --merged HEAD --sort=-version:refname | grep -Fxv "$tag" | head -n 1 || true)"
          if [ -n "$previous_tag" ]; then
            changelog="$(git log "${previous_tag}..HEAD" --first-parent --pretty=format:'- %s (%h)')"
          else
            changelog="$(git log HEAD --first-parent --pretty=format:'- %s (%h)')"
          fi
          if [ -z "$changelog" ]; then
            changelog="- No changes since the previous release."
          fi
          {
            echo "version=$tag"
            echo "tag=$tag"
            echo "previous_tag=$previous_tag"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Rollio ${tag}"
            echo
            if [ -n "$previous_tag" ]; then
              echo "Changes since ${previous_tag}:"
            else
              echo "Changes in this release:"
            fi
            echo
            echo "$changelog"
          } > RELEASE_NOTES.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: Rollio ${{ steps.release_meta.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/*.whl
            dist/*.tar.gz
          fail_on_unmatched_files: true
